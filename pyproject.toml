[project]
name = "trust-agent"
version = "0.1.0"
description = "Trust agent: Ezio trust report -> next best action, with a human in the loop"
authors = [
    { name = "JuaniLlaberia", email = "juanillaberia2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
